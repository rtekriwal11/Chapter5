<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" /> 
    <title></title>
</head>
<body>
    <form method="post" action="./Movie/checkTicketPrice">
        Enter Customer name:
        <input type="text" name="name" />
        <br />
        Enter Number of Adult Tickets:
        <input type="text" name="at" />
        <br />
        Enter Number of Child Tickets:
        <input type="text" name="ct" />
        <br />
        Enter Price for Adult Tickets:
        <input type="text" name="atp" />
        <br />
        Enter Price for Child Tickets:
        <input type="text" name="ctp" />
        <br />
        <input type="submit" value="Submit" />
    </form>
</body>
</html>
